<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypersim</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../phpizza-ui-framework/style.css">
    <link rel="stylesheet" href="titlescreen.css">
</head>
<body>
    <script src="../../node_modules/feather-icons/dist/feather.min.js"></script>
    <div class="title-screen-wrapper">
        <h1>Hypersim</h1>
        <span id="splash"></span>
        <ul class="buttons">
            <li>
                <a href="play.html" class="btn">
                    <i data-feather="play"></i>
                    Play
                </a>
            </li>
            <li>
                <a href="settings.html" class="btn">
                    <i data-feather="settings"></i>
                    Settings
                </a>
            </li>
            <li>
                <button onclick="showCredits();">
                    <i data-feather="layers"></i>
                    Credits
                </button>
            </li>
            <li>
                <button onclick="window.close();">
                    <i data-feather="log-out"></i>
                    Quit Game
                </button>
            </li>
        </ul>
    </div>
    <script src="titlescreen.js"></script>
    <script>feather.replace();</script>
</body>
</html>
